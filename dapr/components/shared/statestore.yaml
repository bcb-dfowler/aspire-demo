# state.redis, doubling as the actor state store required by Dapr Workflow (order-svc and
# inventory-svc both host workflows). keyPrefix "none" means keys are NOT prefixed with the
# calling app-id, so order-svc and inventory-svc can read/write a shared set of keys (e.g. the
# "workflow-result:*" keys inventory-svc writes and order-svc reads back) - see
# AspireDemo.Api/InventoryWorkflowClient.cs and AspireDemo.InventoryService/RecordWorkflowResultActivity.cs.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  # Generous: this AppHost cold-boots 14 containers together, and Redis's default 5s init
  # timeout is routinely too short for that under real machine load.
  initTimeout: 30s
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""
    - name: actorStateStore
      value: "true"
    - name: keyPrefix
      value: none
